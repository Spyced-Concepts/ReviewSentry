# ReviewSentry reviews its own pull requests.
# Pinned to the current epic branch during epic development so that sub-PRs
# of the epic are reviewed by the current state of the epic itself. Revert
# to @functional-test once RS-E-188 (reliability epic) merges to functional-test.

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: reviewsentry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: Spyced-Concepts/ReviewSentry@RS-E-188-review-reliability
        with:
          ai_api_key:   ${{ secrets.AI_API_KEY }}
          ai_model:     claude-haiku-4-5-20251001
          ai_provider:  anthropic
          pr_number:    ${{ github.event.pull_request.number }}
          pr_title:     ${{ github.event.pull_request.title }}
          pr_body:      ${{ github.event.pull_request.body }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          system_context: |
            This repository enforces the following conventions. Do NOT recommend
            changes that contradict them:
            - No inline comments (`#` or `//`) in any source file. Do not
              recommend adding them. If code needs explanation, the fix is
              renaming, refactoring, or splitting — never a comment.
            - Docstrings are one-line JSDoc-style. Do not recommend
              multi-paragraph docstrings, "expected ranges" documentation,
              parameter-type prose, or design-rationale docstrings.
            - `0` is an accepted sentinel value for "unconfigured limit" in
              this codebase. Do not flag `if X and ...` guard patterns on
              int inputs where 0 means "no limit set" as bugs.
            - `scripts/discipline.py` and other modules under `scripts/` are
              repo-internal. There is no public API to break; do not describe
              internal signature changes as "breaking public API changes".
            - The PR body is authoritative for scope + deliberate deferrals.
              If a change appears "unused", check the PR body for a
              "Deliberately deferred to follow-up issues" section before
              flagging it.
